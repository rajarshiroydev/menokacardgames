<!doctype html><html><head><meta charset="utf-8">
<!-- Pokerize logo, design 3b "Glass Stack" from "Pokerize Logo Design/Menoka Logo.dc.html" (icon tile, stack centred). Render with: node scripts/render-icons.mjs --><style>
html,body{margin:0;width:140px;height:140px;overflow:hidden;background:#05080a}
.tile{width:140px;height:140px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%, oklch(0.84 0.2 152 / .2), #05080a 70%)}
.p{position:absolute;inset:0}
.sp{position:absolute;inset:0;background:linear-gradient(165deg, oklch(0.97 0.05 152) 10%, oklch(0.84 0.2 152) 50%, oklch(0.74 0.16 246) 95%)}
</style></head><body>
<div class="tile">
  <div style="zoom:0.42;perspective:1100px;width:220px;height:220px;position:relative;margin-top:44px">
    <div id="stack" style="position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(-32deg)">
      <div style="position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -57px;transform:translateZ(63.5px) rotateZ(32deg)">
        <div style="position:relative;width:120px;height:120px;filter:drop-shadow(0 0 14px oklch(0.84 0.2 152 / .7))">
          <div class="sp" style="clip-path:polygon(50% 12%,80% 42%,50% 72%,20% 42%)"></div>
          <div class="sp" style="clip-path:circle(21.2% at 35% 57%)"></div>
          <div class="sp" style="clip-path:circle(21.2% at 65% 57%)"></div>
          <div class="sp" style="clip-path:polygon(50% 60%,64% 93%,36% 93%)"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const G='oklch(0.84 0.2 152)',B='oklch(0.74 0.16 246)';
const gEdge=j=>`repeating-conic-gradient(from 7.5deg, rgba(230,240,235,.92) 0 15deg, ${j%2?'oklch(0.48 0.13 246 / .9)':'oklch(0.52 0.15 152 / .9)'} 15deg 45deg)`;
const gFace=r=>`radial-gradient(circle, rgba(7,16,20,.9) 0 50%, transparent 50.5%), radial-gradient(circle, transparent 0 53%, rgba(255,255,255,.6) 53% 54.2%, transparent 54.6%), repeating-conic-gradient(from 7.5deg, rgba(255,255,255,.9) 0 15deg, transparent 15deg 45deg), conic-gradient(from ${r}deg, ${G}, ${B}, ${G}, ${B}, ${G})`;
const stack=document.getElementById('stack'), spade=stack.firstElementChild;
[[0,0],[90,7],[45,-5],[135,3]].forEach(([r,ox],i)=>{for(let j=0;j<7;j++){const d=document.createElement('div');d.className='p';d.style.borderRadius='50%';d.style.transform=`translate3d(${ox}px,0,${i*16+j*2.3}px)`;d.style.background=j===6?gFace(r):gEdge(j);d.style.boxShadow=j===6?'inset 0 0 0 1px rgba(255,255,255,.35), 0 0 30px oklch(0.84 0.2 152 / .3)':'none';stack.insertBefore(d,spade);}});
</script></body></html>
